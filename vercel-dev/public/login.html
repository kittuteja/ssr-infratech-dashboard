<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSR INFRATECH DEV · Sign in</title><link rel="icon" href="favicon.jpg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="account.css"><script src="account.js" defer></script></head>
<body class="account-page" data-page="login"><main class="account-card">
<img class="login-logo" src="ssr-logo.jpg" alt="SSR INFRATECH"><p class="environment-label">DEVELOPMENT WORKSPACE</p>
<h1>Welcome back</h1><p>Sign in to your SSR INFRATECH account.</p>
<form id="login-form"><label>Username or email<input name="username" required autocomplete="username" maxlength="254" autocapitalize="none" spellcheck="false"></label>
<label>Password<input name="password" type="password" required autocomplete="current-password" maxlength="128"></label>
<label class="check-label"><input type="checkbox" data-show-password> Show password</label>
<p class="account-error" role="alert" id="account-error"></p><button class="primary" type="submit">Sign in</button></form>
<p class="account-help">Need an account or forgot your password? Contact your SSR administrator.</p>
<a class="owner-link" href="/owner-setup">Site owner: setup or recovery</a>
</main></body></html>
