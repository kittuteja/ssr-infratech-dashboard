<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSR INFRATECH DEV · Password</title><link rel="icon" href="favicon.jpg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="account.css"><script src="account.js" defer></script></head>
<body class="account-page" data-page="password"><main class="account-card"><img class="login-logo" src="ssr-logo.jpg" alt="SSR INFRATECH"><p class="environment-label">DEVELOPMENT WORKSPACE</p><h1>Choose your password</h1><p id="password-description">Changing your password signs out your other sessions.</p>
<form id="password-form"><label>Current or temporary password<input name="currentPassword" type="password" required maxlength="128" autocomplete="current-password"></label>
<label>New password<input name="password" type="password" required minlength="15" maxlength="128" autocomplete="new-password"></label><p class="field-help">15–128 characters. Use a long phrase unique to this account.</p>
<label>Confirm new password<input name="confirmPassword" type="password" required minlength="15" maxlength="128" autocomplete="new-password"></label><p class="account-error" role="alert" id="account-error"></p><button class="primary" type="submit">Save password</button></form>
<a class="owner-link" id="back-inventory" href="/">Back to inventory</a><button class="text-button" type="button" data-logout>Sign out</button></main></body></html>
